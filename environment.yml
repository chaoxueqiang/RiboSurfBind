name: ribosurfbind
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.8.20
  - pip
  - pytorch=2.2.0
  - pytorch-cuda=12.1
  - numpy=1.24.4
  - scipy=1.10.1
  - scikit-learn=1.3.2
  - biopython=1.83
  - matplotlib=3.7.5
  - pandas=2.0.3
  - cmake
  - ninja
  - cxx-compiler
  - pip:
      - torch-geometric==2.6.1
      - pykeops==2.1
      - keopscore==2.1
